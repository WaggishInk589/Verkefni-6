<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" style="background:#111;">
  <style>
    .box { fill:#222; stroke:#fff; stroke-width:2; }
    .text { fill:#fff; font-family:Arial, sans-serif; font-size:16px; }
    .title { font-weight:bold; font-size:18px; }
    .arrow { fill:none; stroke:#fff; stroke-width:2; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  <rect x="40" y="40" width="260" height="120" class="box" rx="10" ry="10" />
  <text x="160" y="70" text-anchor="middle" class="text title">Forsíða</text>
  <text x="160" y="95" text-anchor="middle" class="text">Kynning</text>
  <text x="160" y="115" text-anchor="middle" class="text">Tilboð / þátttaka</text>

  <rect x="460" y="40" width="250" height="100" class="box" rx="10" ry="10" />
  <text x="585" y="70" text-anchor="middle" class="text title">Spjallbox</text>
  <text x="585" y="95" text-anchor="middle" class="text">Nafn</text>
  <text x="585" y="115" text-anchor="middle" class="text">Tölvupóstfang</text>
  <text x="585" y="135" text-anchor="middle" class="text">Textaskilaboð</text>

  <rect x="170" y="200" width="250" height="120" class="box" rx="10" ry="10" />
  <text x="295" y="230" text-anchor="middle" class="text title">Tilboð nánari lýsing</text>
  <text x="295" y="255" text-anchor="middle" class="text">Vörulýsing / skilmálar</text>

  <rect x="460" y="220" width="250" height="100" class="box" rx="10" ry="10" />
  <text x="585" y="250" text-anchor="middle" class="text title">Um okkur</text>
  <text x="585" y="280" text-anchor="middle" class="text">Upplýsingar um</text>
  <text x="585" y="300" text-anchor="middle" class="text">fyrirtæki og starfsmenn</text>

  <rect x="170" y="360" width="250" height="100" class="box" rx="10" ry="10" />
  <text x="295" y="395" text-anchor="middle" class="text title">Kaupa vöru</text>
  <text x="295" y="420" text-anchor="middle" class="text">Upplýsingar um kaupanda,</text>
  <text x="295" y="440" text-anchor="middle" class="text">heimilisfang, tölvupóst o.fl.</text>

  <rect x="40" y="470" width="260" height="80" class="box" rx="10" ry="10" />
  <text x="170" y="500" text-anchor="middle" class="text title">Takk fyrir viðskipti</text>
  <text x="170" y="525" text-anchor="middle" class="text">Aftur á forsíðu</text>

  <path d="M300 100 L460 100" class="arrow" />
  <path d="M300 140 L300 200" class="arrow" />
  <path d="M300 260 L300 360" class="arrow" />
  <path d="M420 260 L460 260" class="arrow" />
  <path d="M300 430 L300 470" class="arrow" />
  <path d="M170 510 L170 540 L70 540" class="arrow" />
  <path d="M70 540 L70 520" class="arrow" />
  <path d="M70 540 L70 520" class="arrow" />
  <path d="M70 520 Q60 500 70 480" class="arrow" />
  <path d="M70 480 L70 100" class="arrow" />
  <path d="M70 100 L40 100" class="arrow" />
  <path d="M40 100 L40 80" class="arrow" />
</svg>